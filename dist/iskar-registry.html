<title>Iskar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark campaign table — a slim top bar with the calendar and the eight
   screens, then wide panels edged in tarnished gold. Single dark visual world. */
:root {
  --bg: #0e1317;
  --bg-2: #121a1f;
  --panel: #151d23;
  --panel-2: #1b252c;
  --line: rgba(201, 164, 106, .22);
  --line-strong: rgba(201, 164, 106, .5);
  --gold: #c9a46a;
  --gold-bright: #ecc98f;
  --gold-ink: #2a1d0e;
  --text: #e9e3d6;
  --muted: #9aa39f;
  --red: #c0584a;
  --green: #79a066;
  --serif: "Cormorant Garamond", "Garamond", "Iowan Old Style", Georgia, serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #1a242b 0%, var(--bg) 60%) fixed, var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; }
h2 { font-size: 22px; }
h3 { font-size: 18px; margin: 14px 0 8px; color: var(--gold-bright); }
p { margin: 0 0 10px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .92em; }
.muted { color: var(--muted); }
.lead { font-size: 17px; line-height: 1.6; max-width: 62ch; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: var(--gold); font-weight: 600; }
.small-print { font-size: 13px; margin-top: 10px; }
.ico { width: 18px; height: 18px; flex: none; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 160px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: grid; gap: 16px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.note { border-left: 3px solid var(--gold); padding: 8px 12px; background: var(--panel-2); border-radius: 0 8px 8px 0; font-size: 14px; }
code { font-family: var(--mono); font-size: .9em; color: var(--gold-bright); }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel-2); cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text); text-decoration: none; }
.btn:hover { border-color: var(--gold); }
.btn.gold { background: linear-gradient(180deg, #e6c48b, #c79f62); color: var(--gold-ink); border-color: #e6c48b; }
.btn.danger { border-color: var(--red); color: #ffd9d2; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.link { background: none; border: 0; padding: 0; color: var(--gold-bright); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
input[type="text"], input[type="password"], select { background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-size: 15px; font-weight: 400; color: var(--text); min-width: 0; max-width: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--gold); width: 16px; height: 16px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-size: 14px; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: #3a4248; color: var(--text); }

/* Panels */
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.page { max-width: 1320px; margin: 0 auto; padding: 22px 16px 60px; display: grid; gap: 18px; }
.page.narrow { max-width: 920px; }
.page.wide { max-width: 1440px; }
.page-head { display: grid; gap: 6px; margin-bottom: 8px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: rgba(13, 18, 22, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-family: var(--serif); font-size: 24px; font-weight: 700; letter-spacing: .22em; background: none; border: 0; cursor: pointer; color: var(--gold-bright); padding: 0 4px; }
.date { display: grid; line-height: 1.15; min-width: 110px; }
.date .mono { font-size: 15px; color: var(--text); }
.date small { color: var(--muted); font-size: 12px; }
.time-ctl { display: inline-flex; align-items: center; gap: 6px; }
.tc-btn { width: 34px; height: 32px; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--panel-2); cursor: pointer; }
.tc-btn[aria-pressed="true"] { background: linear-gradient(180deg, #e6c48b, #c79f62); color: var(--gold-ink); border-color: #e6c48b; }
.speeds { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
.speeds button { border: 0; background: transparent; padding: 5px 10px; font-family: var(--mono); font-size: 13px; cursor: pointer; color: var(--muted); }
.speeds button[aria-pressed="true"] { background: #3a4248; color: var(--text); }
.pending { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--gold); background: rgba(201, 164, 106, .15); color: var(--gold-bright); cursor: pointer; font-weight: 600; font-size: 13px; animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(201, 164, 106, .15); } }
.tabs-nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; max-width: 100%; scrollbar-width: thin; }
.tabs-nav a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap; }
.tabs-nav a:hover { color: var(--text); }
.tabs-nav a[aria-current="page"] { color: var(--gold-bright); background: rgba(201, 164, 106, .12); }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 7px; width: 34px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }

/* Tabs inside panels */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--gold-bright); border-bottom-color: var(--gold); background: rgba(201, 164, 106, .08); border-radius: 6px 6px 0 0; }
.tab-body { min-width: 0; }

/* 1. Title */
.title-screen { position: relative; min-height: 100svh; overflow: hidden; }
.landscape { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.title-content { position: relative; z-index: 1; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); grid-template-rows: auto 1fr auto; gap: 24px; padding: clamp(24px, 6vw, 72px) clamp(16px, 6vw, 80px); background: linear-gradient(90deg, rgba(10, 12, 16, .78), rgba(10, 12, 16, .2) 55%, rgba(10, 12, 16, .3)); }
.title-block { grid-column: 1 / -1; text-align: center; padding-top: 4vh; }
.game-title { font-family: var(--serif); font-weight: 600; font-size: clamp(64px, 12vw, 140px); letter-spacing: .14em; color: #e9d3ae; text-shadow: 0 4px 30px rgba(0, 0, 0, .6); line-height: 1; }
.tagline { text-transform: uppercase; letter-spacing: .32em; font-size: clamp(11px, 1.4vw, 14px); color: #e7d6bb; margin-top: 12px; }
.title-menu { display: grid; gap: 4px; align-self: end; max-width: 320px; }
.title-menu button { display: grid; text-align: left; gap: 0; background: none; border: 0; border-left: 2px solid transparent; padding: 9px 14px; cursor: pointer; font-family: var(--serif); font-size: 22px; font-weight: 600; color: #efe3cc; }
.title-menu button small { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 400; }
.title-menu button:hover, .title-menu button:focus-visible { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(201, 164, 106, .18), transparent); }
.title-quote { grid-column: 1; margin: 0; font-family: var(--serif); font-style: italic; font-size: 18px; color: #d8cbb4; max-width: 46ch; align-self: end; }
.reco { grid-column: 2; grid-row: 2 / 4; align-self: end; background: rgba(16, 20, 24, .85); border: 1px solid var(--line-strong); border-radius: 12px; padding: 14px; display: grid; gap: 6px; }
.reco b { font-family: var(--serif); font-size: 20px; }
.reco span { color: var(--muted); font-size: 14px; }
.reco-img { border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; }
.reco-img > svg, .alt-img > svg { width: 100%; height: 100%; display: block; }

/* New game */
.civ-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.civ-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; text-align: left; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.civ-card b { font-family: var(--serif); font-size: 22px; display: block; }
.civ-card span { font-size: 13px; }
.civ-card p { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
.civ-card.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.scenario h2 { margin: 4px 0 8px; }

/* 2. Map */
.map-panel { padding: 14px; }
.map-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.map-title { font-size: 22px; letter-spacing: .08em; margin-right: auto; }
.map-stage { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: #0d1d27; touch-action: none; cursor: grab; aspect-ratio: 800 / 560; max-width: 100%; }
.map-inner { position: absolute; inset: 0; transform-origin: center; }
.map-inner canvas, .region-map canvas, .civ-banner canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
.map-overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.civ-label { cursor: pointer; }
.civ-label .name { font-family: var(--serif); font-weight: 700; font-size: 26px; fill: #f6ead2; paint-order: stroke; stroke: rgba(20, 14, 8, .75); stroke-width: 4px; }
.civ-label .type { font-family: var(--serif); font-style: italic; font-size: 13px; fill: #f0e2c6; paint-order: stroke; stroke: rgba(20, 14, 8, .75); stroke-width: 3px; }
.civ-label:hover .name, .civ-label:focus-visible .name { fill: var(--gold-bright); }
.civ-label .cap { fill: var(--gold-bright); stroke: #2a1d0e; }
.civ-label .capname, .city text { font-size: 11px; fill: #f3e7d0; paint-order: stroke; stroke: rgba(20, 14, 8, .8); stroke-width: 3px; }
.city circle { fill: #f3e7d0; stroke: #2a1d0e; stroke-width: 1.5; }
.route { fill: none; stroke: #f0cf8f; stroke-width: 2; stroke-dasharray: 6 6; opacity: .85; }
.conflict circle { fill: rgba(192, 88, 74, .18); stroke: #e0705f; stroke-width: 2; stroke-dasharray: 4 4; }
.conflict .pulse { fill: none; stroke-dasharray: none; animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .8; transform: scale(.7); } to { opacity: 0; transform: scale(1.6); } }
.conflict text { font-size: 11px; fill: #ffd2c9; paint-order: stroke; stroke: rgba(20, 14, 8, .8); stroke-width: 3px; }
.res circle { fill: rgba(20, 16, 10, .78); stroke: var(--gold); stroke-width: 1.2; }
.res .ico { color: var(--gold-bright); }
.ocean { font-family: var(--serif); font-style: italic; font-size: 15px; fill: #9fc0cf; opacity: .85; }
.compass circle { fill: rgba(10, 14, 18, .55); stroke: var(--gold); }
.compass path { fill: var(--gold-bright); }
.compass text, .scalebar text { font-size: 12px; fill: #f3e7d0; font-family: var(--mono); }
.scalebar path { stroke: #f3e7d0; stroke-width: 2; fill: none; }
.layers { position: absolute; top: 12px; right: 12px; background: rgba(13, 18, 22, .9); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 14px; display: grid; gap: 6px; z-index: 2; }
.zoom-ctl { position: absolute; right: 12px; bottom: 12px; display: grid; gap: 4px; z-index: 2; }
.zoom-ctl button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line-strong); background: rgba(13, 18, 22, .9); cursor: pointer; }
.map-legend { position: absolute; left: 12px; top: 12px; z-index: 2; background: rgba(13, 18, 22, .9); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; display: grid; grid-template-columns: auto auto; gap: 4px 10px; font-size: 12px; max-width: 70%; }
.map-legend span:first-child { grid-column: 1 / -1; font-weight: 600; }
.map-legend i { grid-column: 1 / -1; height: 8px; border-radius: 4px; display: block; }
.map-legend span:nth-of-type(3) { text-align: right; }

/* 3. Civilization */
.civ-banner { position: relative; height: 180px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.civ-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 12, 16, .85), rgba(10, 12, 16, .25)); }
.civ-banner-text { position: absolute; z-index: 1; left: 20px; bottom: 18px; display: flex; gap: 14px; align-items: center; }
.civ-banner-text h1 { font-size: 44px; }
.civ-banner-text span { font-family: var(--serif); font-style: italic; font-size: 18px; color: #e9d9bc; }
.banner-actions { position: absolute; z-index: 1; right: 16px; top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.civ-overview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; margin: 0; font-size: 15px; }
.kv dt { color: var(--muted); font-size: 14px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.pluses, .minuses { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.pluses li::before { content: "✦"; color: var(--gold); margin-right: 8px; }
.minuses li::before { content: "◆"; color: var(--red); margin-right: 8px; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.grid3 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.bar { display: inline-block; width: 120px; max-width: 100%; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; vertical-align: middle; }
.bar > span { display: block; height: 100%; border-radius: 4px; }
.tonebar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0; }
.tonebar.big { height: 18px; }
.tonebar span { height: 100%; }
.legend { list-style: none; padding: 0; margin: 0 0 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 12px; font-size: 14px; }
.legend li { display: flex; gap: 8px; align-items: center; }
.legend li .mono { margin-left: auto; color: var(--muted); }
.legend i, .legend-row i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 6px 0; }
.legend-row span { display: inline-flex; gap: 6px; align-items: center; }
.resident-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
.resident-grid figure { margin: 0; display: grid; gap: 6px; }
.resident-grid figcaption { display: grid; font-size: 13px; line-height: 1.3; }
.resident-grid figcaption span { color: var(--muted); font-size: 12px; }
.pt { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #1c1612; line-height: 0; }
.pt > svg, .pt > img { width: 100%; height: auto; display: block; aspect-ratio: 5 / 6; object-fit: cover; }
.people-row { display: flex; gap: 12px; flex-wrap: wrap; }
.mini-person { width: 118px; display: grid; gap: 4px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.mini-person b { font-size: 14px; line-height: 1.2; }
.mini-person span { font-size: 12px; color: var(--muted); line-height: 1.25; }
.mini-person .pt { width: 72px; }
.relations { display: grid; gap: 10px; }
.rel-row { display: grid; grid-template-columns: 30px 110px minmax(0, 1fr) 46px; gap: 12px; align-items: center; }
.rel-bar { position: relative; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, .07); }
.rel-bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
.rel-bar span { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.timeline li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(201, 164, 106, .1); }
.timeline li.past { color: var(--muted); }
.timeline.vertical li { grid-template-columns: 10px 170px minmax(0, 1fr); align-items: baseline; }
.civ-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* 4. Region */
.region-panel { padding: 14px; }
.region-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.region-head h1 { font-size: 30px; }
.region-head select { margin-left: auto; }
.region-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; }
.loc-list { display: grid; gap: 6px; align-content: start; }
.loc { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: left; }
.loc.static { grid-template-columns: minmax(0, 1fr); cursor: default; }
.loc.on { border-color: var(--gold); background: rgba(201, 164, 106, .1); }
.loc b { display: block; font-size: 15px; }
.loc small { color: var(--muted); }
.loc .pt { border-radius: 50%; width: 42px; height: 42px; }
.loc .pt > svg { aspect-ratio: auto; height: 100%; object-fit: cover; }
.region-map { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 800 / 560; }
.place { cursor: pointer; }
.place circle { fill: #f3e7d0; stroke: #2a1d0e; stroke-width: 2; }
.place.big circle { fill: var(--gold-bright); }
.place text { font-family: var(--serif); font-weight: 700; font-size: 17px; fill: #fff6e4; paint-order: stroke; stroke: rgba(20, 14, 8, .85); stroke-width: 4px; }
.place.big text { font-size: 21px; }
.place:hover text, .place:focus-visible text { fill: var(--gold-bright); }

/* 5. Character */
.char-head { display: grid; grid-template-columns: 180px minmax(0, 1fr) minmax(220px, 300px); gap: 20px; align-items: start; margin-bottom: 18px; }
.char-portrait { box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
.char-id h1 { font-size: 38px; margin-bottom: 6px; }
.char-id p { margin: 0 0 2px; font-size: 16px; }
.etat ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
.etat li { display: grid; grid-template-columns: 22px 70px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 14px; }
.etat .bar { width: 100%; }
.char-switch { margin-top: 16px; }
.traits, .goal-progress { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.traits li, .goal-progress li { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 14px; }
.traits .bar, .goal-progress .bar { width: 100%; }
.goals { padding-left: 0; list-style: none; display: grid; gap: 8px; margin: 0; }
.goals li::before { content: "✦"; color: var(--gold); margin-right: 8px; }
.rel-list { display: grid; gap: 10px; }
.rel-list.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.rel-person { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.rel-person span { display: grid; line-height: 1.25; }
.rel-person small { color: var(--muted); font-size: 12.5px; }
.journal { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.journal li { border-left: 2px solid var(--gold); padding-left: 14px; }
.journal p { font-family: var(--serif); font-size: 18px; font-style: italic; margin: 4px 0 0; }

    s += `<g stroke="${brow}" stroke-width="0.55" stroke-linecap="round">`;
    const hairs = Math.round(10 + a.face.browThickness * 14);
    for (let i = 0; i < hairs; i++) {
      const t = i / hairs;
      const [hx, hy] = at(t);
      const len = thick * rng.range(1.1, 1.8) * (t > 0.85 ? 0.6 : 1);
      const off = rng.range(-thick / 2, thick / 2);
      const rise = t < 0.3 ? 0.9 : 0.35;
      s += `<line x1="${f(hx)}" y1="${f(hy + off)}" x2="${f(hx + side * len * (1 - rise * 0.5))}" y2="${f(hy + off - len * rise)}"/>`;

  }
  return s;
}

function marksSvg(ctx, a, v, g, P, rng) {
  const { cx, cy, W } = g;

    const vr = new Rng(a.marks.vitiligo.seed);
    const light = mixHex(a.skin.hex, '#f2e4d8', 0.75);
    for (let i = 0; i < a.marks.vitiligo.patches; i++) {
      const px = cx + vr.range(-W * 0.7, W * 0.7), py = cy + vr.range(-30, 40);
      const pts = Array.from({ length: 8 }, (_, k) => {
        const ang = (k / 8) * Math.PI * 2, rr = vr.range(3, 8);
        return [px + rr * Math.cos(ang), py + rr * Math.sin(ang)];

      s += `<path d="${smoothClosed(pts)}" fill="${light}" opacity="0.9" filter="${ctx.blur(0.5)}"/>`;
    }
  }
  if (a.marks.freckles) {
    const n = Math.round(14 + a.marks.freckles * 36);
    const fc = shadeHex(a.skin.hex, 0.66);
    for (let i = 0; i < n; i++) {
      const side = i % 2 ? 1 : -1;
      const x = cx + side * rng.range(2, W * 0.75), y = g.ey + rng.range(8, 24) + Math.abs(x - cx) * 0.08;

  if (a.marks.birthmark) s += `<ellipse cx="${f(cx - W + a.marks.birthmark.x * 2 * W)}" cy="${f(cy - 40 + a.marks.birthmark.y * 90)}" rx="4" ry="2.6" fill="${mixHex(a.skin.hex, '#7a3b2e', 0.3)}" opacity="0.6" filter="${ctx.blur(0.6)}"/>`;

    s += `<path d="M${cx - 16},${f(cy - 32)} q16,-3 32,0"/>`;
    if (v.wrinkles > 0.4) s += `<path d="M${cx - 12},${f(cy - 37)} q12,-2 24,0"/><path d="M${cx - 3},${f(g.ey - 11)} v-4 M${cx + 3},${f(g.ey - 11)} v-4"/>`;
    s += `<path d="M${cx - 12},${f(g.ny + 2)} q-6,8 -4,${f(g.my - g.ny + 4)}"/><path d="M${cx + 12},${f(g.ny + 2)} q6,8 4,${f(g.my - g.ny + 4)}"/>`;

    s += `<path d="M${f(sx - 5)},${f(sy - 6)} L${f(sx + 5)},${f(sy + 7)}" stroke="${P.shadow}" stroke-width="0.5" stroke-dasharray="1.5 2"/>`;

function facialHairSvg(ctx, style, g, color, tex, rng) {

  const pal = hairPalette(color);
  if (style === 'stubble') {
    let s = `<path d="M${f(cx - W * 0.86)},${f(cy + 8)} Q${f(cx - jawW)},${f(cy + H * 0.9)} ${cx},${f(cy + H)} Q${f(cx + jawW)},${f(cy + H * 0.9)} ${f(cx + W * 0.86)},${f(cy + 8)} Q${cx},${f(my + 2)} ${f(cx - W * 0.86)},${f(cy + 8)}Z" fill="${pal.dark}" opacity="0.12" filter="${ctx.blur(2.5)}"/><g fill="${pal.dark}" opacity="0.24">`;
    for (let i = 0; i < 320; i++) {
      const ang = rng.range(0.05, Math.PI - 0.05);
      const rr = rng.range(0.5, 1);
      const x = cx + Math.cos(ang) * W * 0.86 * rr, y = cy + 12 + Math.sin(ang) * (H - 10) * rr;
      if (Math.abs(x - cx) < 13 && y < my + 5 && y > my - 6) continue;
      s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(rng.range(0.22, 0.42))}"/>`;
    }
    return s + `</g><ellipse cx="${cx}" cy="${f(cy + H * 0.65)}" rx="${f(jawW)}" ry="${f(H * 0.35)}" fill="${pal.base}" opacity="0.1" filter="${ctx.blur(3)}"/>`;
  }

  const tache = hairMass(ctx, moustache, tex === 'straight' ? 'straight' : 'wavy', color, rng, { detail: 2 });
  if (style === 'moustache') return tache;
  const depth = style === 'full-beard' ? 20 : 9;
  const beard = [
    [cx - W * 0.93, cy + 2], [cx - W * 0.82, cy + H * 0.6], [cx - 15, cy + H + depth * 0.6], [cx, cy + H + depth], [cx + 15, cy + H + depth * 0.6],
    [cx + W * 0.82, cy + H * 0.6], [cx + W * 0.93, cy + 2], [cx + W * 0.76, cy + 18], [cx + 16, my - 4], [cx, my - 6], [cx - 16, my - 4], [cx - W * 0.76, cy + 18],
  ];

const CLOTHING_STYLES = ['tunic', 'v-neck', 'wrap', 'high-collar', 'shawl', 'coat'];

function clothingSvg(ctx, a, g, shoulder, neckW) {
  const { cx, cy } = g;
  const h = hashString(`${a.seed}::clothing`);
  const style = CLOTHING_STYLES[h % CLOTHING_STYLES.length];
  const hue = a.clothingHue;
  const sat = 22 + (h % 25);
  const base = `hsl(${hue} ${sat}% 36%)`;
  const lit = `hsl(${hue} ${sat}% 47%)`;

  s += `<g fill="none" stroke="${dark}" stroke-linecap="round" opacity="0.55"><path d="M${f(cx - shoulder + 16)},${cy + 112} q6,40 2,90" stroke-width="2"/><path d="M${f(cx + shoulder - 18)},${cy + 108} q-8,40 -4,100" stroke-width="2.4"/><path d="M${cx - 18},${cy + 118} q3,20 0,40" stroke-width="1.2"/></g>`;
  s += `<path d="M${f(cx - shoulder + 10)},${cy + 100} q14,-18 34,-20" fill="none" stroke="${lit}" stroke-width="2" opacity="0.6" stroke-linecap="round"/>`;
  const nl = f(cx - neckW - 6), nr = f(cx + neckW + 6);
  switch (style) {
    case 'tunic':
      s += `<path d="M${f(cx - neckW - 7)},${top - 2} Q${cx},${top + 18} ${f(cx + neckW + 7)},${top - 2}" fill="none" stroke="${trim}" stroke-width="4"/>`;
      break;
    case 'v-neck':
      s += `<path d="M${nl},${top - 2} L${cx},${top + 30} L${nr},${top - 2}Z" fill="${g.skin}"/>`;
      s += `<path d="M${cx - 4},${top + 4} L${cx},${top + 28} L${cx + 6},${top + 4}Z" fill="${g.shade}" opacity="0.6" filter="${ctx.blur(2)}"/>`;
      s += `<path d="M${nl},${top - 2} L${cx},${top + 30} L${nr},${top - 2}" fill="none" stroke="${trim}" stroke-width="3" stroke-linejoin="round"/>`;
      break;
    case 'wrap':
      s += `<path d="M${nl},${top - 2} L${cx + 12},${top + 40} L${nr},${top - 2}Z" fill="${g.skin}"/>`;
      s += `<path d="M${cx + 2},${top + 8} L${cx + 12},${top + 38} L${cx + 16},${top + 10}Z" fill="${g.shade}" opacity="0.5" filter="${ctx.blur(2)}"/>`;
      s += `<path d="M${nr},${top - 2} L${cx - 20},242" stroke="${dark}" stroke-width="2.5" fill="none"/><path d="M${nl},${top - 2} L${cx + 12},${top + 40} L${nr},${top - 2}" fill="none" stroke="${trim}" stroke-width="3.5"/>`;
      break;
    case 'high-collar':
      s += `<path d="M${f(cx - neckW - 2)},${top - 14} L${f(cx - neckW - 4)},${top + 4} Q${cx},${top + 10} ${f(cx + neckW + 4)},${top + 4} L${f(cx + neckW + 2)},${top - 14} Q${cx},${top - 8} ${f(cx - neckW - 2)},${top - 14}Z" fill="${base}" stroke="${trim}" stroke-width="1.6"/>`;
      s += `<path d="M${cx},${top + 6} V242" stroke="${trim}" stroke-width="1.5"/>`;

      break;

      const sf = ctx.linear([[0, `hsl(${trimHue} 35% 56%)`], [1, `hsl(${trimHue} 35% 32%)`]], { x1: 0, y1: 0, x2: 1, y2: 1 });

      s += `<path d="M${f(cx - shoulder - 2)},${cy + 112} Q${f(cx - shoulder + 10)},${top - 6} ${f(cx - neckW - 4)},${top - 4} Q${cx + 10},${top + 34} ${f(cx + shoulder - 6)},${cy + 150} L${f(cx + shoulder - 20)},242 L${f(cx - shoulder)},242Z" fill="${sf}"/>`;
      s += `<g fill="none" stroke="hsl(${trimHue} 35% 44%)" stroke-width="1.6" opacity="0.8"><path d="M${f(cx - shoulder + 8)},${cy + 130} Q${cx},${cy + 120} ${f(cx + shoulder - 16)},${cy + 170}"/><path d="M${f(cx - shoulder + 4)},${cy + 150} Q${cx},${cy + 140} ${f(cx + shoulder - 22)},${cy + 196}"/></g>`;
      s += `<path d="M${f(cx - shoulder + 2)},${cy + 160} Q${cx},${cy + 150} ${f(cx + shoulder - 24)},${cy + 214}" fill="none" stroke="${trim}" stroke-width="2.5" stroke-dasharray="3 3"/>`;
      break;
    }
    case 'coat':
      s += `<path d="M${nl},${top - 2} L${cx - 4},${top + 44} L${f(cx - neckW - 22)},${top + 12}Z" fill="${lit}" opacity="0.9"/><path d="M${nr},${top - 2} L${cx + 4},${top + 44} L${f(cx + neckW + 22)},${top + 12}Z" fill="${dark}" opacity="0.9"/>`;
      s += `<path d="M${f(cx - neckW - 4)},${top - 2} L${cx},${top + 28} L${f(cx + neckW + 4)},${top - 2}Z" fill="hsl(${trimHue} 20% 85%)"/>`;
      for (let i = 0; i < 3; i++) s += `<circle cx="${cx}" cy="${top + 52 + i * 18}" r="2" fill="${trim}"/>`;

/**
 * Render a portrait.
 * Options: { size, title, background (default true), detail (lower for tiny renders) }
 */
function renderPortrait(a, { size = 200, title, background = true, detail = 1, backdrop = 'day' } = {}) {
  const v = visibleAppearance(a);
  const rng = Rng.stream(a.seed, `portrait:${a.age}:${a.events.length}`);
  const uid = `p${hashString(`${a.seed}|${a.age}|${JSON.stringify(a.events)}|${size}|${background}|${detail}|${title ?? ''}`).toString(36)}`;
  const ctx = new Ctx(uid);
  const g = geometry(a, v);
  const { cx, cy, W } = g;
  const skin = a.skin.hex;
  const P = featurePalette(skin);
  g.skin = skin;
  g.shade = P.shade;
  const hairColor = v.hairHex;
  const buildIdx = ['slight', 'lean', 'average', 'sturdy', 'broad', 'heavy'].indexOf(a.body.build) + v.buildShift;
  const shoulder = (g.child ? 58 : 74) + clamp(buildIdx, 0, 5) * 4.5;
  const neckW = W * 0.42 + clamp(buildIdx, 0, 5) * 1.1 - (g.child ? 2 : 0);

  const parts = [];
  if (background) {
    const bgHue = (a.clothingHue + 190) % 360;
    const dusk = backdrop === 'dusk';
    const bg = dusk
      ? ctx.radial([[0, `hsl(${(bgHue + 160) % 360} 16% 34%)`], [0.7, `hsl(${(bgHue + 160) % 360} 18% 20%)`], [1, `hsl(${(bgHue + 160) % 360} 20% 12%)`]], { cx: 0.42, cy: 0.36, r: 0.8 })
      : ctx.radial([[0, `hsl(${bgHue} 22% 84%)`], [0.7, `hsl(${bgHue} 18% 72%)`], [1, `hsl(${bgHue} 20% 58%)`]], { cx: 0.42, cy: 0.38, r: 0.75 });
    parts.push(`<rect width="200" height="240" fill="${bg}"/>`);
    parts.push(`<ellipse cx="${cx - 10}" cy="${cy - 20}" rx="80" ry="90" fill="${dusk ? '#e9c79a' : `hsl(${bgHue} 30% 92%)`}" opacity="${dusk ? 0.16 : 0.45}" filter="${ctx.blur(12)}"/>`);
  }
  const hair = hairSvg(ctx, a, v, g, hairColor, rng, detail);
  parts.push(hair.back);

  // Neck with the jaw's cast shadow.
  const neckFill = ctx.linear([[0, P.shade], [0.4, skin], [1, shadeHex(skin, 0.92)]]);
  parts.push(`<path d="M${f(cx - neckW)},${cy + 26} L${f(cx - neckW - 1.5)},${cy + 84} L${f(cx + neckW + 1.5)},${cy + 84} L${f(cx + neckW)},${cy + 26}Z" fill="${neckFill}"/>`);
  parts.push(`<path d="M${f(cx - neckW - 1)},${cy + 40} Q${cx},${cy + 62} ${f(cx + neckW + 1)},${cy + 40} L${f(cx + neckW + 1)},${cy + 30} L${f(cx - neckW - 1)},${cy + 30}Z" fill="${P.deep}" opacity="0.5" filter="${ctx.blur(2.5)}"/>`);
  parts.push(`<path d="M${f(cx + neckW * 0.3)},${cy + 50} L${f(cx + neckW + 1)},${cy + 84}" stroke="${P.shade}" stroke-width="5" opacity="0.5" filter="${ctx.blur(2)}"/>`);
  parts.push(clothingSvg(ctx, a, g, shoulder, neckW));

  // Ears.
  const earR = 6 + a.face.earSize * 3;
  for (const side of [-1, 1]) {
    const ex = cx + side * (W - 1);
    parts.push(`<ellipse cx="${f(ex)}" cy="${cy + 1}" rx="${f(earR * 0.62)}" ry="${f(earR)}" fill="${side < 0 ? skin : P.shade}"/>`);
    parts.push(`<path d="M${f(ex + side)},${f(cy - earR * 0.6)} q${f(side * earR * 0.45)},${f(earR * 0.5)} 0,${f(earR * 1.2)}" fill="none" stroke="${P.shadow}" stroke-width="1.2" opacity="0.8"/>`);
  }

  // Face.
  const faceD = smoothClosed(g.outline);
  const faceClip = ctx.clip(faceD);
  const faceFill = ctx.linear([[0, P.lit], [0.45, skin], [1, shadeHex(skin, 0.9)]], { x1: 0, y1: 0.2, x2: 1, y2: 0.6 });
  parts.push(`<path d="${faceD}" fill="${faceFill}"/>`);
  parts.push(faceModelling(ctx, a, g, P, faceClip));
  if (hair.shadowLine !== null) {
    parts.push(`<g clip-path="${faceClip}"><ellipse cx="${cx}" cy="${f(hair.shadowLine - 2)}" rx="${f(W * 1.1)}" ry="7" fill="${P.deep}" opacity="0.45" filter="${ctx.blur(3)}"/></g>`);
  }
  parts.push(marksSvg(ctx, a, v, g, P, rng));

          <dt>Niveau de développement</dt><dd>${c.developpement}</dd><dt>Stabilité</dt><dd class="mono">${Math.round(s.stability)} / 100</dd></dl></div>
        <div><p class="lead">${esc(c.description)}</p>
          <h3>Forces</h3><ul class="pluses">${c.forces.map((f) => `<li>${f}</li>`).join('')}</ul>
          <h3>Défis</h3><ul class="minuses">${c.defis.map((f) => `<li>${f}</li>`).join('')}</ul></div></div>`;
      break;
    case 'politique':
      body = `<div class="grid2"><div><h3>Institutions</h3><dl class="kv"><dt>Régime</dt><dd>${c.regime}</dd><dt>Stabilité</dt><dd>${bar(s.stability, { label: 'Stabilité' })} <span class="mono">${Math.round(s.stability)}</span></dd><dt>Tensions sociales</dt><dd>${bar(s.tension, { color: 'var(--red)', label: 'Tensions' })} <span class="mono">${Math.round(s.tension)}</span></dd><dt>Trésor</dt><dd class="mono">${Math.round(s.treasury)}</dd></dl></div>
        <div><h3>Figures publiques</h3><div class="people-row">${leaders.map((p) => `<button type="button" class="mini-person" data-action="go" data-to="personnage" data-char="${p.id}">${portrait(p.appearance, { size: 64, title: p.name })}<b>${esc(p.name)}</b><span>${esc(p.role)}</span></button>`).join('')}</div></div></div>`;
      break;
    case 'economie': {
      const h = app.world.history[id];
      body = `<div class="grid2"><div><h3>Prix du grain</h3>${lineChart([{ points: h.map((x) => [x.day, x.price]).concat([[app.world.day, s.price]]), color: 'var(--gold)', area: true }], { height: 200, label: 'Prix du grain' })}</div>
        <div><h3>Indicateurs</h3><dl class="kv"><dt>Production de grain</dt><dd>${delta(s.prod - 100)} par rapport à la normale</dd><dt>Réserves</dt><dd>${fmtNum(s.reserves)} mois</dd><dt>Exportations</dt><dd>${pct(s.exports * 100)} des surplus</dd><dt>Activité (indice)</dt><dd class="mono">${fmtNum(s.gdp, 1)}</dd><dt>Trésor</dt><dd class="mono">${Math.round(s.treasury)}</dd></dl></div></div>`;
      break;
    }
    case 'societe': {
      if (!distCache.has(id)) distCache.set(id, toneDistribution(id));
      const dist = distCache.get(id);
      const people = representativeSample({ regionId: id, settlement: 'urban', count: 8, seed: `societe:${app.round}`, oversample: 5 });
      const pools = Object.entries(c.ancestry).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${ANCESTRAL_POOLS[k].label} ${Math.round(v * 100)} %`).join(' · ');
      body = `<div class="grid2"><div><h3>Apparence de la population</h3><p class="muted">Répartition des teintes de peau (échantillon de ${dist.n} habitants). Chaque civilisation mêle plusieurs ascendances : ${pools}.</p>
          <div class="tonebar big">${SKIN_TONE_CATEGORIES.map((t) => `<span style="width:${(dist.counts[t.id] / dist.n) * 100}%;background:${skinHex((t.min + Math.min(t.max, 1)) / 2)}" title="${FR.skin[t.id]}"></span>`).join('')}</div>
          <ul class="legend">${SKIN_TONE_CATEGORIES.map((t) => `<li><i style="background:${skinHex((t.min + Math.min(t.max, 1)) / 2)}"></i>${FR.skinShort[t.id]}<span class="mono">${Math.round((dist.counts[t.id] / dist.n) * 100)} %</span></li>`).join('')}</ul>
          <dl class="kv"><dt>Santé publique</dt><dd>${bar(s.health, { color: 'var(--green)', label: 'Santé' })} <span class="mono">${Math.round(s.health)}</span></dd><dt>Tensions sociales</dt><dd>${bar(s.tension, { color: 'var(--red)', label: 'Tensions' })} <span class="mono">${Math.round(s.tension)}</span></dd></dl></div>
        <div><h3>Habitants</h3><div class="resident-grid">${people.map((p) => `<figure>${portrait(p, { size: 96, title: residentName(p) })}<figcaption><b>${esc(residentName(p))}</b><span>${p.age} ans · ${residentRole(p)}</span></figcaption></figure>`).join('')}</div>
          <button class="btn small" type="button" data-action="reroll">D’autres habitants</button></div></div>`;
      break;
    }
    case 'relations':
      body = `<div class="relations">${CIV_IDS.filter((o) => o !== id).map((o) => {
        const v = app.world.relations[id][o];
        const col = v > 20 ? 'var(--green)' : v < -20 ? 'var(--red)' : 'var(--gold)';
        return `<div class="rel-row">${emblem(o, 28)}<b>${civ(o).name}</b><span class="rel-bar"><span style="left:${v < 0 ? 50 + v / 2 : 50}%;width:${Math.abs(v) / 2}%;background:${col}"></span></span><span class="mono">${v > 0 ? '+' : ''}${Math.round(v)}</span></div>`;
      }).join('')}<p class="muted">De −100 (hostiles) à +100 (alliés).</p></div>`;
      break;
    case 'historique': {
      const pre = PREHISTORY.filter((p) => p.civ === id).map((p) => ({ when: String(p.year), text: p.text }));
      const recent = app.world.log.filter((e) => e.civ === id).slice(0, 12).map((e) => ({ when: fmtDate(e.day), text: e.text }));
      body = `<ol class="timeline">${[...recent, ...pre.reverse()].map((x) => `<li><span class="mono">${x.when}</span><span>${esc(x.text)}</span></li>`).join('') || '<li>Rien à signaler.</li>'}</ol>`;
      break;
    }
  }
  const prov = c.provinces[0];
  return `<section class="page">
    <header class="civ-banner"><canvas data-paint="region:${id}:${prov.id}" aria-hidden="true"></canvas>
      <div class="civ-banner-text">${emblem(id, 60)}<div><h1>${c.name}</h1><span>${c.type}</span></div></div>
      <div class="banner-actions"><select data-action="select-civ" aria-label="Civilisation">${CIV_IDS.map((o) => `<option value="${o}"${o === id ? ' selected' : ''}>${civ(o).name}</option>`).join('')}</select>
      <button type="button" class="btn small" data-action="go" data-to="region" data-civ="${id}" data-prov="${prov.id}">Voir les régions</button></div></header>
    <div class="panel"><div class="tabs" role="tablist">${tabs}</div><div class="tab-body">${body}</div></div>
  </section>`;
}

// ---------------------------------------------------------------------------
// 4. Vue d'une région

const REGION_LAYERS = { villes: 'Villes', villages: 'Villages', routes: 'Routes', rivieres: 'Rivières', frontieres: 'Frontières', ressources: 'Ressources' };

function viewRegion(app) {
  const { civ: cid, id: pid } = app.province;
  const c = civ(cid);
  const prov = c.provinces.find((p) => p.id === pid) ?? c.provinces[0];
  const layout = layoutRegion(cid, prov);
  const list = layout.places.map((p) => {
    const rep = representativeSample({ regionId: cid, settlement: KIND_SETTLEMENT[p.kind], count: 1, seed: `loc:${p.name}`, oversample: 2 })[0];
    return `<button type="button" class="loc${app.locality === p.name ? ' on' : ''}" data-action="locality" data-name="${esc(p.name)}">${portrait(rep, { size: 40, title: residentName(rep) })}<span><b>${esc(p.name)}</b><small>${fmtInt(p.pop)} hab.</small></span></button>`;
  }).join('') + (prov.others ? `<div class="loc static"><span><b>Autres localités</b><small>(${prov.others})</small></span></div>` : '');
  const labels = layout.places.map((p) => `<g class="place${p.pop >= 20000 ? ' big' : ''}" data-action="locality" data-name="${esc(p.name)}" tabindex="0" role="button"><circle cx="${p.x}" cy="${p.y}" r="${p.pop >= 20000 ? 7 : 5}"/><text x="${p.x + 12}" y="${p.y - 10}">${esc(p.name)}</text></g>`).join('');
  const res = app.regionLayers.ressources ? layout.places.slice(1).map((p, i) => `<g class="res" transform="translate(${p.x - 40},${p.y + 18})"><circle cx="9" cy="9" r="10"/><g transform="translate(2.5 2.5) scale(.55)">${icon(['wheat', 'tree', 'sack', 'gear'][i % 4]).replace('<svg', '<svg width="24" height="24"')}</g></g>`).join('') : '';
  const layers = Object.entries(REGION_LAYERS).map(([k, l]) => `<label class="check"><input type="checkbox" data-action="region-layer" data-layer="${k}" ${app.regionLayers[k] !== false ? 'checked' : ''}> ${l}</label>`).join('');
  const sel = layout.places.find((p) => p.name === app.locality);
  let detail = '';
  if (sel) {
    const people = representativeSample({ regionId: cid, settlement: KIND_SETTLEMENT[sel.kind], count: 6, seed: `loc:${sel.name}:${app.round}`, oversample: 4 });
    const notables = Object.values(app.world.characters).filter((p) => p.place === sel.name);
    detail = `<div class="panel"><div class="row-between"><div><div class="eyebrow">${FR_KIND[sel.kind]}</div><h2>${esc(sel.name)}</h2><p class="muted">${fmtInt(sel.pop)} habitants</p></div><button class="btn small" type="button" data-action="reroll">D’autres habitants</button></div>
      ${notables.length ? `<h3>Personnages</h3><div class="people-row">${notables.map((p) => `<button type="button" class="mini-person" data-action="go" data-to="personnage" data-char="${p.id}">${portrait(p.appearance, { size: 64, title: p.name })}<b>${esc(p.name)}</b><span>${esc(p.role)}</span></button>`).join('')}</div>` : ''}
      <h3>Habitants</h3><div class="resident-grid">${people.map((p) => `<figure>${portrait(p, { size: 96, title: residentName(p) })}<figcaption><b>${esc(residentName(p))}</b><span>${p.age} ans · ${residentRole(p)}</span></figcaption></figure>`).join('')}</div></div>`;
  }
  return `<section class="page wide">
    <div class="panel region-panel">
      <div class="region-head">${emblem(cid, 40)}<div><h1>${esc(prov.name)}</h1><span class="muted">${c.name}</span></div>
        <select data-action="select-province" aria-label="Province">${CIV_IDS.flatMap((o) => civ(o).provinces.map((p) => `<option value="${o}:${p.id}"${o === cid && p.id === prov.id ? ' selected' : ''}>${civ(o).name} — ${esc(p.name)}</option>`)).join('')}</select></div>
      <div class="region-body">
        <nav class="loc-list" aria-label="Localités">${list}</nav>
        <div class="region-map"><canvas data-paint="regionmap:${cid}:${prov.id}" aria-hidden="true"></canvas>
          <svg class="map-overlay" viewBox="0 0 ${layout.W} ${layout.H}">${res}${labels}<g class="scalebar" transform="translate(30 ${layout.H - 30})"><path d="M0,0 h120 M0,-5 v10 M60,-3 v6 M120,-5 v10"/><text x="0" y="-9">0</text><text x="60" y="-9" text-anchor="middle">10</text><text x="120" y="-9" text-anchor="middle">20 km</text></g></svg>
          <aside class="layers"><div class="eyebrow">Afficher</div>${layers}</aside></div>
      </div>
    </div>
    ${detail}
  </section>`;
}
const FR_KIND = { urban: 'Ville', town: 'Bourg', rural: 'Village', port: 'Port', border: 'Ville frontalière' };

// ---------------------------------------------------------------------------
// 5. Fiche d'un personnage

const CHAR_TABS = { apercu: 'Aperçu', relations: 'Relations', journal: 'Journal', objectifs: 'Objectifs', competences: 'Compétences', inventaire: 'Inventaire', apparence: 'Apparence' };
const ETAT_ICON = { Santé: ['heart', 'var(--red)'], Moral: ['smile', 'var(--gold)'], Finances: ['coin', 'var(--green)'] };

function viewPersonnage(app) {
  const w = app.world;
  const p = w.characters[app.character] ?? w.characters['mara-venn'];
  const a = p.appearance;
  const tabs = Object.entries(CHAR_TABS).map(([k, l]) => `<button type="button" role="tab" data-action="char-tab" data-tab="${k}" aria-selected="${app.charTab === k}">${l}</button>`).join('');
  const rel = (r) => {
    const o = w.characters[r.id];
    if (!o) return '';
    return `<button type="button" class="rel-person" data-action="go" data-to="personnage" data-char="${o.id}">${portrait(o.appearance, { size: 48, title: o.name })}<span><b>${esc(o.name)}</b><small>${esc(r.kind)}</small><small class="mono">Confiance : ${r.trust}</small></span></button>`;
  };
  let body = '';
  switch (app.charTab) {
    case 'apercu':
      body = `<div class="grid3">
        <div><h3>Traits</h3><ul class="traits">${TRAITS.map((t) => `<li><span>${t}</span>${bar(p.traits[t], { color: 'linear-gradient(90deg,#b4523f,#d9a35a)', label: t })}<span class="mono">${p.traits[t]}</span></li>`).join('')}</ul></div>
        <div><h3>Objectifs</h3><ul class="goals">${p.objectifs.map((o) => `<li>${esc(o.text)}</li>`).join('') || '<li class="muted">Aucun objectif connu.</li>'}</ul>
          ${p.context ? `<h3>Contexte</h3><p class="muted">${esc(p.context)}</p>` : ''}</div>
        <div><h3>Relations clés</h3><div class="rel-list">${p.relations.map(rel).join('') || '<p class="muted">Aucune relation enregistrée.</p>'}</div></div></div>`;
      break;
    case 'relations': {
      const known = Object.values(w.characters).filter((o) => o.id !== p.id && o.civ === p.civ && !p.relations.some((r) => r.id === o.id));
      body = `<h3>Relations</h3><div class="rel-list wide">${p.relations.map(rel).join('')}</div>
        <h3>Autres personnages ${de(civ(p.civ).name)}</h3><div class="people-row">${known.map((o) => `<button type="button" class="mini-person" data-action="go" data-to="personnage" data-char="${o.id}">${portrait(o.appearance, { size: 56, title: o.name })}<b>${esc(o.name)}</b><span>${esc(o.role)}</span></button>`).join('')}</div>`;
      break;
    }
    case 'journal':
      body = `<ol class="journal">${p.journal.map((j) => `<li><span class="mono">${fmtDate(j.day)}</span><p>${esc(j.text)}</p></li>`).join('') || '<li class="muted">Le journal est vide.</li>'}</ol>`;
      break;
    case 'objectifs':
      body = `<ul class="goal-progress">${p.objectifs.map((o) => `<li><span>${esc(o.text)}</span>${bar(o.progress, { label: o.text })}<span class="mono">${o.progress} %</span></li>`).join('') || '<li class="muted">Aucun objectif connu.</li>'}</ul>`;
      break;
    case 'competences':
      body = `<ul class="traits">${Object.entries(p.competences).map(([k, v]) => `<li><span>${k}</span>${bar(v, { label: k })}<span class="mono">${v}</span></li>`).join('')}</ul>`;
      break;
    case 'inventaire':
      body = `<ul class="inventory">${p.inventaire.map((i) => `<li>${icon('sack')}<span>${esc(i)}</span></li>`).join('') || '<li class="muted">Rien de notable.</li>'}</ul>`;
      break;
    case 'apparence': {
      const v = visibleAppearance(a);
      body = `<div class="grid2"><dl class="kv">
        <dt>Peau</dt><dd><i class="dot" style="background:${a.skin.hex}"></i> ${FR.skin[a.skin.category]} · sous-ton ${FR.undertone[a.skin.undertone]} · <span class="mono">${a.skin.tone.toFixed(2)}</span></dd>
        <dt>Cheveux</dt><dd><i class="dot" style="background:${v.hairHex}"></i> ${FR.texture[a.hair.texture]}, ${FR.hairColor[a.hair.color]}${v.grey > 0.15 ? ', grisonnants' : ''}, ${FR.style[v.hairStyle]}</dd>
        <dt>Yeux</dt><dd><i class="dot" style="background:${EYE_COLORS[a.eyes.color]}"></i> ${FR.eyeColor[a.eyes.color]}, ${FR.lid[a.eyes.lid]}</dd>
        <dt>Visage</dt><dd>${FR.face[a.face.shape]}</dd><dt>Silhouette</dt><dd>${FR.build[a.body.build]}, ${a.body.heightCm} cm</dd>
        ${a.parents ? `<dt>Parents</dt><dd>${a.parents.map((id) => esc(w.characters[id]?.name ?? id)).join(' et ')}</dd>` : ''}</dl>
        <div><h3>Description d’identité</h3><p class="muted">Envoyée au modèle d’image avec chaque demande (en anglais).</p><p class="descriptor">${esc(identityRecord(a).descriptor)}</p></div></div>`;
      break;
    }
  }
  const etat = Object.entries(p.etat).map(([k, v]) => `<li><span class="etat-ico" style="color:${ETAT_ICON[k][1]}">${icon(ETAT_ICON[k][0])}</span><span>${k}</span>${bar(v, { color: ETAT_ICON[k][1], label: k })}<span class="mono">${v}</span></li>`).join('');
  const options = Object.values(w.characters).sort((x, y) => x.civ.localeCompare(y.civ)).map((o) => `<option value="${o.id}"${o.id === p.id ? ' selected' : ''}>${esc(o.name)} — ${civ(o.civ).name}</option>`).join('');
  return `<section class="page">
    <div class="panel char-sheet">
      <div class="char-head">${portrait(a, { size: 180, title: p.name, cls: 'char-portrait' })}
        <div class="char-id"><h1>${esc(p.name)}</h1><p>${p.age} ans · ${civ(p.civ).name}</p><p>${esc(p.role)}</p><p class="muted">${esc(p.place)}</p></div>
        <div class="etat"><div class="eyebrow">État actuel</div><ul>${etat}</ul>
          <label class="field char-switch">Changer de personnage<select data-action="select-char">${options}</select></label></div>
      </div>
      <div class="tabs" role="tablist">${tabs}</div><div class="tab-body">${body}</div>
    </div>
  </section>`;
}

// ---------------------------------------------------------------------------
// 6. Événements et décisions

function viewEvenements(app) {
  const w = app.world;
  const pending = w.pending[0];
  if (pending) {
    return `<section class="page narrow"><article class="panel decision">
      ${sceneFor(app, pending.image, pending.civ, pending.title)}
      <div class="decision-body"><h1>${esc(pending.title)}</h1><p class="muted">${fmtDate(pending.day)}${pending.place ? ` · ${esc(pending.place)}` : ''}</p><p class="lead">${esc(pending.text)}</p>
      <div class="choices">${pending.choices.map((c) => `<button type="button" class="choice" data-action="decide" data-uid="${pending.uid}" data-choice="${c.id}">${icon('arrow')}<span><b>${esc(c.label)}</b><small>${esc(c.hint)}</small></span></button>`).join('')}</div>
      ${w.pending.length > 1 ? `<p class="muted">${w.pending.length - 1} autre(s) décision(s) en attente.</p>` : ''}</div></article></section>`;
  }
  const recent = w.log.filter((e) => (e.civ === w.playerCiv || e.kind === 'choice') && e.image && !e.silent).slice(0, 6);
  return `<section class="page">
    <div class="page-head"><div class="eyebrow">Événements et décisions</div><h1>Aucune décision en attente</h1><p class="muted">Le temps s’arrête dès que votre conseil doit trancher. Reprenez la simulation depuis la barre du haut.</p></div>
    <div class="event-grid">${recent.map((e) => `<article class="panel event-card">${sceneFor(app, e.image, e.civ, e.title ?? e.text)}<div><span class="mono muted">${fmtDate(e.day)}</span><h3>${esc(e.title ?? '')}</h3><p>${esc(e.text)}</p></div></article>`).join('') || '<p class="muted">Pas encore d’événements.</p>'}</div>
  </section>`;
}

// ---------------------------------------------------------------------------
// 7. Simulation et temps

const TIME_TABS = { evenements: 'Événements', indicateurs: 'Indicateurs', graphiques: 'Graphiques', chronologie: 'Chronologie' };

function viewTemps(app) {
  const w = app.world;
  const tabs = Object.entries(TIME_TABS).map(([k, l]) => `<button type="button" role="tab" data-action="time-tab" data-tab="${k}" aria-selected="${app.timeTab === k}">${l}</button>`).join('');
  const feed = w.log.filter((e) => !e.silent && (e.civ === w.playerCiv || ['choice', 'decision'].includes(e.kind) || e.kind === 'event'));
  let body = '';
  if (app.timeTab === 'evenements') {
    body = `<ul class="log">${feed.slice(0, 40).map((e) => `<li class="k-${e.kind}"><span class="mono">${fmtDate(e.day, { year: false })}</span>${e.civ !== w.playerCiv ? `<span class="civ-dot" style="background:${civ(e.civ).color}" title="${civ(e.civ).name}"></span>` : ''}<span>${esc(e.text)}</span></li>`).join('')}</ul>`;
  } else if (app.timeTab === 'indicateurs') {
    body = `<div class="table-wrap"><table class="data"><thead><tr><th>Civilisation</th><th>Population (M)</th><th>Prix du grain</th><th>Réserves (mois)</th><th>Stabilité</th><th>Tensions</th><th>Armée</th></tr></thead><tbody>${CIV_IDS.map((id) => {
      const s = w.civs[id];
      return `<tr${id === w.playerCiv ? ' class="me"' : ''}><th>${civ(id).name}</th><td>${fmtNum(s.population, 2)}</td><td>${Math.round(s.price)} ${delta(trend(w, id, 'price'), { invert: true })}</td><td>${fmtNum(s.reserves)}</td><td>${Math.round(s.stability)}</td><td>${Math.round(s.tension)}</td><td>${Math.round(s.military)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  } else if (app.timeTab === 'graphiques') {
    const metric = (key, label) => `<div><h3>${label}</h3>${lineChart(CIV_IDS.map((id) => ({ points: w.history[id].map((h) => [h.day, h[key]]).concat([[w.day, w.civs[id][key]]]), color: civ(id).color })), { height: 180, label })}</div>`;
    body = `<div class="legend-row">${CIV_IDS.map((id) => `<span><i style="background:${civ(id).color}"></i>${civ(id).name}</span>`).join('')}</div><div class="grid2">${metric('price', 'Prix du grain')}${metric('stability', 'Stabilité')}${metric('reserves', 'Réserves (mois)')}${metric('tension', 'Tensions sociales')}</div>`;
  } else {
    const items = [...w.log.filter((e) => ['choice', 'harvest'].includes(e.kind) || (e.kind === 'event' && e.civ === w.playerCiv)).slice(0, 30)];
    body = `<ol class="timeline">${items.map((e) => `<li><span class="mono">${fmtDate(e.day)}</span><span>${esc(e.text)}</span></li>`).join('')}${PREHISTORY.slice().reverse().map((p) => `<li class="past"><span class="mono">${p.year}</span><span>${esc(p.text)}</span></li>`).join('')}</ol>`;
  }
  const latest = feed.find((e) => e.image);
  return `<section class="page">

  'char-tab': (d) => { app.charTab = d.tab; render({ keepScroll: true }); },
  'time-tab': (d) => { app.timeTab = d.tab; render({ keepScroll: true }); },
  'ana-tab': (d) => { app.anaTab = d.tab; render({ keepScroll: true }); },
  'exp-tab': (d) => { app.expTab = d.tab; render({ keepScroll: true }); },
  locality: (d) => { app.locality = d.name; render({ keepScroll: true }); },
  reroll: () => { app.round++; render({ keepScroll: true }); },
  'test-imagegen': async () => {
    const status = $('#ig-status');
    status.textContent = 'Test en cours…';
    try { await testConnection(readImageForm()); status.textContent = 'Connexion réussie.'; } catch (e) { status.textContent = `Échec : ${e.message}. Vérifiez l’adresse, la clé et que le service accepte les requêtes de ce site.`; }
  },
  'clear-save': (d) => {
    if (!d.confirm) { app.confirmClear = true; render({ keepScroll: true }); return; }
    store.del(SAVE_KEY);
    setPlaying(false);
    app.world = null;
    app.confirmClear = false;
    toast('Sauvegarde effacée');
    go('accueil');
  },
  'cancel-clear': () => { app.confirmClear = false; render({ keepScroll: true }); },
};

const CHANGES = {
  layer: (el) => { app.layers[el.dataset.layer] = el.checked; render({ keepScroll: true }); },
  'region-layer': (el) => { app.regionLayers[el.dataset.layer] = el.checked; render({ keepScroll: true }); },
  'select-civ': (el) => { app.civ = el.value; render({ keepScroll: true }); },
  'select-char': (el) => { app.character = el.value; render({ keepScroll: true }); },
  'select-province': (el) => { const [c, p] = el.value.split(':'); app.province = { civ: c, id: p }; app.locality = null; render({ keepScroll: true }); },
  'ana-civ': (el) => { app.anaCiv = el.value; render({ keepScroll: true }); },
};

function readImageForm() {
  return {
    ...loadConfig(),
    enabled: $('#ig-enabled').checked,
    endpoint: $('#ig-endpoint').value.trim(),
    apiKey: $('#ig-key').value.trim(),
    model: $('#ig-model').value.trim(),
    size: $('#ig-size').value.trim(),
    style: $('#ig-style').value.trim(),
  };
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.matches('input, select')) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el.dataset); }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-action], svg [data-action]')) {
    e.preventDefault();
    ACTIONS[e.target.dataset.action]?.(e.target.dataset);
  }
  if (e.key === ' ' && app.world && GAME_VIEWS.includes(app.view) && !e.target.closest('input, select, textarea, button, a, [role="button"], [role="link"]')) {
    e.preventDefault();
    (app.playing ? ACTIONS.pause : ACTIONS.play)();
  }
});
document.addEventListener('change', (e) => {
  const fn = CHANGES[e.target.dataset.action];
  if (fn) fn(e.target);
});
document.addEventListener('submit', (e) => {
  if (e.target.dataset.form === 'imagegen') {
    e.preventDefault();
    saveConfig(readImageForm());
    toast('Paramètres enregistrés');
  }
});

function fromHash() {
  const h = location.hash.slice(1);
  app.view = RENDER[h] ? h : 'accueil';
  if (GAME_VIEWS.includes(app.view) && !app.world) {
    app.world = readSave();
    if (app.world) app.civ = app.anaCiv = app.world.playerCiv;
    else app.view = 'accueil';
  }
  render();
}
window.addEventListener('hashchange', fromHash);
fromHash();

return {  };
})();
})();
</script>
